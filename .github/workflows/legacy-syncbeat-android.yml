# NOTE: This workflow predates the OG HOST project. It built an unrelated
# Android app ("SyncSound") whose Gradle sources are not in this repository
# (only `syncbeat (1).zip` is), so it can never succeed as written.
#
# It is kept for history but restricted to manual dispatch only, so it no
# longer fails on every push to main. Delete it once you are sure you do not
# need it. The OG HOST workflows are `web.yml` and `windows-agent.yml`.

name: "LEGACY — SyncBeat Android APK (unrelated, manual only)"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java JDK
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Generate Gradle Wrapper & Build APK
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: SyncSound-App
        path: app/build/outputs/apk/debug/app-debug.apk
