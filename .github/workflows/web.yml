name: Web CI

on:
  push:
    branches: ["main"]
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/shared/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (Next.js)
        run: npm run lint --workspace @oghost/web
        continue-on-error: false

      - name: TypeScript — shared package
        run: npm run typecheck --workspace @oghost/shared

      - name: TypeScript — web app
        run: npm run typecheck --workspace @oghost/web

      - name: Unit tests — shared package
        run: npm run test --workspace @oghost/shared

      - name: Unit tests — web app
        run: npm run test --workspace @oghost/web

      - name: Production build
        run: npm run build --workspace @oghost/web
        env:
          # Build-time placeholders. Real values come from the Vercel
          # environment; nothing secret is needed to compile.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          NEXT_PUBLIC_APP_URL: https://example.vercel.app

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/.next
          retention-days: 7
          if-no-files-found: warn

  migrations:
    name: Validate SQL migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check migrations parse as SQL
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/migrations/*.sql)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No migrations found"; exit 1
          fi
          for f in "${files[@]}"; do
            echo "--- $f"
            # Cheap structural sanity checks: balanced parens and statements
            # terminated with semicolons.
            python3 - "$f" <<'PY'
          import sys, re
          path = sys.argv[1]
          text = open(path, encoding="utf-8").read()
          # strip line comments and string literals before counting parens
          stripped = re.sub(r"--[^\n]*", "", text)
          stripped = re.sub(r"'(?:[^']|'')*'", "''", stripped)
          if stripped.count("(") != stripped.count(")"):
              print(f"unbalanced parentheses in {path}")
              sys.exit(1)
          # every non-empty, non-comment line block should end in ; or be a
          # continuation of a $$ body — so just assert the file ends with ;
          tail = stripped.strip()
          if not tail.endswith(";"):
              print(f"{path} does not end with a semicolon")
              sys.exit(1)
          print(f"ok: {path}")
          PY
          done

      - name: Guard against destructive statements
        run: |
          set -euo pipefail
          # The user's existing tables must never be dropped by a migration.
          if grep -rniE "drop[[:space:]]+table[[:space:]]+(if[[:space:]]+exists[[:space:]]+)?(public\.)?(nodes|servers|pairing_codes|node_events)\b" supabase/migrations; then
            echo "ERROR: a migration drops one of the original tables."
            exit 1
          fi
          echo "No destructive statements against the original tables."
