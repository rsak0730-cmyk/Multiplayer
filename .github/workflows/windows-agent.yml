name: Windows Agent CI

on:
  push:
    branches: ["main"]
    paths:
      - "services/windows-agent/**"
      - ".github/workflows/windows-agent.yml"
  pull_request:
    paths:
      - "services/windows-agent/**"
      - ".github/workflows/windows-agent.yml"
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "8.0.x"
  AGENT_DIR: services/windows-agent

jobs:
  test:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        working-directory: ${{ env.AGENT_DIR }}
        run: dotnet restore OGHost.Agent.sln

      - name: Build (Release)
        working-directory: ${{ env.AGENT_DIR }}
        run: dotnet build OGHost.Agent.sln -c Release --no-restore

      - name: Test
        working-directory: ${{ env.AGENT_DIR }}
        run: dotnet test OGHost.Agent.sln -c Release --no-build --logger "trx;LogFileName=agent-tests.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-test-results
          path: ${{ env.AGENT_DIR }}/TestResults/**/*.trx
          if-no-files-found: warn

      # The console log and the uploaded .trx are both served from hosts outside
      # api.github.com (results-receiver.actions.githubusercontent.com and
      # productionresultssa5.blob.core.windows.net), so a failing test run is
      # unreadable to anything that cannot open the Actions UI. $GITHUB_STEP_SUMMARY
      # is not exposed by the REST API either — output.summary comes back empty for
      # a workflow job — but check-run annotations are, so emit one per failing test
      # as well as the human-readable summary.
      #
      # Reporting must never decide the job outcome, so everything is wrapped: a bug
      # here can only cost visibility, never turn a green build red.
      - name: Report test failures
        if: always()
        shell: pwsh
        working-directory: ${{ env.AGENT_DIR }}
        run: |
          try {
            function To-Int([string]$value) {
              if ([string]::IsNullOrEmpty($value)) { 0 } else { [int]$value }
            }
            # Workflow-command escaping. Properties additionally escape ':' and ','.
            function Escape-Data([string]$value) {
              $value -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            }
            # Parenthesised on purpose: `Escape-Data $value -replace ...` leaves the
            # operator in argument position, where PowerShell may try to bind
            # -replace as a parameter name instead of applying it to the result.
            function Escape-Property([string]$value) {
              (Escape-Data $value) -replace ':', '%3A' -replace ',', '%2C'
            }

            $trxFiles = Get-ChildItem -Path TestResults -Filter '*.trx' -Recurse -ErrorAction SilentlyContinue

            if (-not $trxFiles) {
              Write-Host '::warning::No .trx was produced: the build failed before the test step ran.'
              'No .trx was produced: the build failed before the test step ran.' |
                Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              exit 0
            }

            $lines = New-Object System.Collections.Generic.List[string]
            $totalAll = 0
            $passedAll = 0
            $failedAll = 0
            $notExecutedAll = 0

            foreach ($file in $trxFiles) {
              [xml]$doc = Get-Content -Path $file.FullName -Raw
              $counters = $doc.TestRun.ResultSummary.Counters
              $fileTotal = To-Int $counters.total
              $filePassed = To-Int $counters.passed
              $fileFailed = To-Int $counters.failed
              $fileSkipped = To-Int $counters.notExecuted
              $totalAll += $fileTotal
              $passedAll += $filePassed
              $failedAll += $fileFailed
              $notExecutedAll += $fileSkipped

              $lines.Add("### $($file.Name)")
              $lines.Add("outcome: **$($doc.TestRun.ResultSummary.outcome)** · total $fileTotal · passed $filePassed · failed $fileFailed · not executed $fileSkipped")
              $lines.Add('')

              $notPassed = @($doc.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -ne 'Passed' })
              foreach ($test in $notPassed) {
                $message = [string]$test.Output.ErrorInfo.Message
                $stack = [string]$test.Output.ErrorInfo.StackTrace
                if (-not $message -and -not $stack) { $message = "(no message recorded; outcome $($test.outcome))" }

                $body = $message.Trim()
                if ($stack) {
                  $trimmedStack = $stack.Trim()
                  if ($trimmedStack.Length -gt 1500) { $trimmedStack = $trimmedStack.Substring(0, 1500) + ' ...[truncated]' }
                  $body = ($body + "`n`n" + $trimmedStack).Trim()
                }
                # Stay well inside the 64KB per-annotation limit.
                if ($body.Length -gt 4000) { $body = $body.Substring(0, 4000) + ' ...[truncated]' }

                $title = [string]$test.testName
                if ($title.Length -gt 300) { $title = $title.Substring(0, 300) + ' ...' }
                Write-Host "::error title=$(Escape-Property $title)::$(Escape-Data $body)"

                $lines.Add("#### $title — $($test.outcome)")
                $lines.Add('```')
                $lines.Add($body)
                $lines.Add('```')
                $lines.Add('')
              }
            }

            $header = "Agent tests: $totalAll total · $passedAll passed · $failedAll failed · $notExecutedAll not executed"
            Write-Host "::notice title=$(Escape-Property 'Agent test totals')::$(Escape-Data $header)"
            $lines.Insert(0, '')
            $lines.Insert(0, "**$header**")
            $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          catch {
            # Never fail the build because the reporter broke.
            Write-Host "::warning::Test reporter failed: $($_.Exception.Message)"
            exit 0
          }
  publish:
    name: Publish release artifacts
    needs: test
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      matrix:
        rid: [win-x64, win-arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish self-contained single-file agent
        working-directory: ${{ env.AGENT_DIR }}
        run: >
          dotnet publish src/OGHost.Agent/OGHost.Agent.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish/${{ matrix.rid }}

      - name: Stage artifact
        shell: pwsh
        run: |
          $stage = "dist/og-host-windows-agent-${{ matrix.rid }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/scripts" | Out-Null

          Copy-Item "${{ env.AGENT_DIR }}/publish/${{ matrix.rid }}/*" $stage -Recurse -Force
          Copy-Item "${{ env.AGENT_DIR }}/scripts/install-service.ps1" "$stage/scripts/" -Force
          Copy-Item "${{ env.AGENT_DIR }}/README.md" "$stage/AGENT-README.md" -Force

          # Fail loudly rather than publishing an artifact with no executable in it.
          if (-not (Test-Path "$stage/OGHost.Agent.exe")) {
            throw "OGHost.Agent.exe missing from the staged artifact."
          }
          Get-ChildItem -Recurse $stage | Select-Object -ExpandProperty FullName

      - name: Compute checksum
        shell: pwsh
        working-directory: dist
        run: |
          $zip = "og-host-windows-agent-${{ matrix.rid }}.zip"
          Compress-Archive -Path "og-host-windows-agent-${{ matrix.rid }}/*" -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -FilePath "$zip.sha256" -Encoding ascii -NoNewline
          Write-Host "SHA256: $hash"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: og-host-windows-agent-${{ matrix.rid }}
          path: |
            dist/og-host-windows-agent-${{ matrix.rid }}.zip
            dist/og-host-windows-agent-${{ matrix.rid }}.zip.sha256
          retention-days: 30

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/og-host-windows-agent-${{ matrix.rid }}.zip
            dist/og-host-windows-agent-${{ matrix.rid }}.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
